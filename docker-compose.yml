# ============================================================================
# LINA MANUFACTURING · DOCKER COMPOSE DEPLOYMENT CONFIGURATION
# ============================================================================

version: '3.8'

services:
  stock-count-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lina-stock-verification-cloud
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - HOST=0.0.0.0
    volumes:
      # Persistent storage for SQLite database & cryptographic audit logs
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
